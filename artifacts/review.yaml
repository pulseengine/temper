# AI-review redesign (temper#92). Stage 2: mechanical gates carry what they
# can, independent of the model reviewer.

artifacts:
  - id: REQ-038
    type: requirement
    title: The rivet oracle SHALL review a pull request whenever it is configured, whether or not the model review is enabled, and an oracle-only comment SHALL NOT claim a model ran
    status: implemented
    description: >
      Until 2026-11-19 reviewPullRequest and both PR handlers returned on
      ai_review.enabled false before the oracle, so pausing the model on
      netcup also paused the only mechanical review check. isReviewEnabled
      (model or configured oracle) now gates the handlers; the model call
      and its endpoint check run only with ai_review.enabled.
    fields:
      priority: must
      category: functional
      corrective: true
      upstream-ref: temper#92
    links:
      - type: derives-from
        target: SC-010

  - id: VER-022
    type: verification
    title: Oracle-only review tests (no model call, honest footer, handler gate)
    status: implemented
    fields:
      method: automated-test
      test-name: "reviewPullRequest with ai_review off; isReviewEnabled; pull_request.synchronize reviews when only the oracle is on"
      test-location: __tests__/integration/ai-review-oracle-only.test.js, __tests__/integration/app.test.js
    links:
      - type: verifies
        target: REQ-038

  - id: REQ-039
    type: requirement
    title: The rivet oracle SHALL run only when its binary reports the configured rivet version and the target repository pins the configured varve layer
    status: implemented
    description: >
      Findings from a rivet other than the one the repository's own CI runs
      contradict that CI, and oracle findings bypass the model's filter and
      can raise the verdict to request_changes. The production host carried
      rivet 0.4.3 while layer 2026.11.0 carries 0.41.1 (temper#94). Missing
      configuration, a missing pin or any difference skips the oracle with a
      log line.
    fields:
      priority: must
      category: functional
      corrective: true
      upstream-ref: temper#94
    links:
      - type: derives-from
        target: SC-008

  - id: VER-023
    type: verification
    title: Oracle version gate tests (pure gate table, skip paths, parsers)
    status: implemented
    fields:
      method: automated-test
      test-name: "oracleVersionGate (temper#94); reviewPullRequest skips the oracle when it is not the pinned rivet; repoVarveLayer; rivetBinaryVersion"
      test-location: __tests__/integration/ai-review-oracle-only.test.js, __tests__/unit/rivet-version.test.js
    links:
      - type: verifies
        target: REQ-039

  - id: REQ-042
    type: requirement
    title: With varve configured, the rivet oracle SHALL run the rivet each commit pins, resolved from validated pin strings against the deploy's trusted realms, one store per pin, and SHALL never install
    status: implemented
    description: >
      Repositories move their own varve pins (on 2026-11-20 the first six
      production PRs pinned 2026.11.10 or 2026.11.16 while the oracle carried
      2026.11.0), so a single configured layer skipped every one. The head
      oracle runs the head commit's pinned rivet and base validate the base
      commit's. Only realm, channel and layer are read from the repository
      and validated (realm on rivet_oracle.realms_allowed, layer a dated
      name). temper writes its own pin directory with a copy of the deploy's
      realms file, because the realms file carries the trust root and a
      fork PR's copy would let it name its own key. Each pin gets its own
      VARVE_ROOT, since anti-rollback is per line per store (varve#256).
      A layer the host has not installed, a pin that fails validation or an
      unexpected varve answer is a skip logged with the repository and layer.
    fields:
      priority: must
      category: functional
      corrective: true
      upstream-ref: temper#94
    links:
      - type: derives-from
        target: SC-008
      - type: refines
        target: REQ-039

  - id: VER-026
    type: verification
    title: Per-repo rivet tests (pin parser and validator, pin directory and store, head/base binaries, skip paths)
    status: implemented
    description: >
      Unit and integration tests with a fake varve, plus a one-off check of
      resolvePinnedRivet against varve 0.47.0 on the mini (2026-11-20):
      empty per-pin store gives "not installed"; after varve install into
      that store it resolves rivet 0.41.1; a realms file with another trust
      root resolves nothing.
    fields:
      method: automated-test
      test-name: "parseVarvePin; validateVarvePin; resolvePinnedRivet; per-repo rivet; validateConfig: per-repo rivet oracle"
      test-location: __tests__/unit/rivet-pin.test.js, __tests__/integration/ai-review-oracle-per-repo.test.js, __tests__/unit/schema.test.js
    links:
      - type: verifies
        target: REQ-042

  - id: REQ-043
    type: requirement
    title: The rivet oracle SHALL read the validate and impact JSON of the rivet versions the layers carry (0.41.1, 0.42.2), iterating only fields that are lists
    status: implemented
    description: >
      rivet 0.41+ reports lifecycle_gaps as a count and the gaps as
      lifecycle_coverage. The parser was written for 0.4.3 and threw
      "number 149 is not iterable" on the first three production PRs after
      the per-repo switch (2026-11-20), so the oracle never produced a
      finding with a current rivet. Oracle failures log repo and layer.
    fields:
      priority: must
      category: functional
      corrective: true
    links:
      - type: derives-from
        target: SC-008
      - type: refines
        target: REQ-042

  - id: VER-027
    type: verification
    title: rivet output shape tests on real 0.41.1 and 0.42.2 output
    description: >
      Fixtures are real `rivet validate --format json` output on this
      repository, trimmed. On the old parser the test fails with the
      production error; the oracle was also run end to end with rivet 0.42.2
      (covalent 2026.11.16) on this repository: validate PASS, 13
      lifecycle-gap findings, impact parsed.
    status: implemented
    fields:
      method: automated-test
      test-name: "runRivetValidate on rivet %s output; rivet output fields of an unexpected type; oracle failures name the repo and layer"
      test-location: __tests__/unit/rivet-validate-shape.test.js, __tests__/integration/ai-review-oracle-per-repo.test.js
    links:
      - type: verifies
        target: REQ-043

  - id: REQ-040
    type: requirement
    title: The model review SHALL be off by default, switched on only for a model that clears the pre-registered bar on the review benchmark, and /health SHALL report the review state with its reason
    status: implemented
    description: >
      Owner decision 2026-11-19 on temper#92: no local model met the bar
      (primary recall >= 10 of 40). config.yml sets ai_review.enabled false
      with off_reason; /health carries review.model and review.oracle so the
      off state is visible, not silently idle.
    fields:
      priority: must
      category: functional
      upstream-ref: temper#92
    links:
      - type: derives-from
        target: SC-006

  - id: VER-024
    type: verification
    title: reviewStatus and /health review-state tests
    status: implemented
    fields:
      method: automated-test
      test-name: "reviewStatus (temper#92); health endpoint shows the model review as off, with its reason (temper#92)"
      test-location: __tests__/integration/ai-review-oracle-only.test.js, __tests__/integration/app.test.js
    links:
      - type: verifies
        target: REQ-040

  - id: FEAT-007
    type: feature
    title: Oracle-first PR review with the model review gated by a benchmark
    status: implemented
    description: >
      src/ai-review.js (isReviewEnabled, reviewStatus, the oracle version
      gate), config.yml. The benchmark itself (eval/review-bench) follows
      in its own PR.
    links:
      - type: satisfies
        target: REQ-040
      - type: satisfies
        target: REQ-042
      - type: satisfies
        target: REQ-043
