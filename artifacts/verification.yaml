        target: REQ-031

  - id: VER-035
    type: verification
    title: The generated dependabot.yml validates against SchemaStore's dependabot-2.0 schema
    status: implemented
    description: >
      plant#12 (opened 2026-11-18 by the deploy at b9f7e8d, which predates
      the temper#90 fix) put groups at the top level, which the schema
      forbids. The test renders buildDependabotYaml with config.yml's
      dependabot_generation and with the built-in defaults through
      yaml.dump/yaml.load, and validates the result with ajv against the
      vendored schema (sha256 891027089ecaeaf2..., fetched 2026-11-25).
      Negative controls: the plant#12 shape fails on additionalProperties
      groups, and package-ecosystem inside a per-entry group fails. A mutant
      that adds a top-level groups key fails 3 of 5 tests. This is a
      test-time check of the heuristic generator only; REQ-006's runtime
      validation before apply (which would also cover the AI-enhanced path,
      off by config) stays open. The ecosystem detector now skips manifests
      under fixture, fixtures, testdata, test-data, ci-controls, vendor,
      third_party, node_modules and target; on plant's tree at 4542688 it
      gives cargo and github-actions at / only (a skip-removed mutant fails
      2 tests in __tests__/unit/ecosystem-detector.test.js).
    fields:
      method: automated-test
      test-name: "generated dependabot.yml against the SchemaStore schema"
      test-location: __tests__/unit/dependabot-schema.test.js
    links:
      - type: verifies
        target: REQ-006

  - id: VER-037
    type: verification
    title: A scoped sync replays only the in-scope recorded writes
    status: implemented
    description: >
      Writes are recorded through the real dry-run recorder (one of every
      kind plus a content PUT and a PR POST). Negative control: --repo plant
      --only tag_rulesets against a three-repo plan sends exactly plant's two
      tag rulesets. Also: exact replay of route, path params and body; content
      and PR writes never replayed; held and fork scopes not written; a repo
      stops at its first failed write; dry run sends nothing. Mutants: kind
      filter off fails 6, repo filter off fails 1, scope guard off fails 1,
      non-replayable kinds replayed fails 6. Live, read-only on 2026-11-25:
      plan --repo plant,sieve --only (all but labels) lists the 6 writes per
      repo that the org plan had, and `sync --repos plant` is refused.
    fields:
      method: automated-test
      test-name: "scopedSync"
      test-location: __tests__/unit/scoped-sync.test.js
    links:
      - type: verifies
        target: REQ-045

  - id: VER-038
    type: verification
    title: A repo's own release-tag patterns (tag_include) are evaluated and enforced, every pattern covered
    status: implemented
    description: >
      relay tags releases falcon-v* (every tag on the repo), which the org
      default refs/tags/v* does not cover. standards.repos.relay.tag_include
      is ["refs/tags/v*", "refs/tags/falcon-v*"]; each pattern is sampled and
      must meet the tag standard (since 2026-11-26: deletion and update
      blocked, admin bypass only; formerly immutable and creation-restricted).
      Cases: v*-only rulesets
      drift for relay; falcon-v*-only rulesets drift too (every pattern
      counts); both covered is ok; enforcement builds the tag ruleset on
      both patterns; other repos stay on v*; tag_include must be a
      non-empty list of refs/tags/ patterns. Mutants: per-repo include
      ignored fails 3, builder ignores include fails 1, only the last
      pattern counted fails 1. Live, read-only 2026-11-25: relay's plan
      intends "refs/tags/v*,refs/tags/falcon-v*". Same change pins
      hostname_scan to 8b93a3e (stub PRs become plannable; hostname-scan is
      required only once the stub exists) and names wohl's 21 checks, all
      matching wohl #116's check runs.
    fields:
      method: automated-test
      test-name: "per-repo release-tag patterns (standards.repos.<repo>.tag_include)"
      test-location: __tests__/unit/standards.test.js
    links:
      - type: verifies
        target: REQ-019

