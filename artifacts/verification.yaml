    title: verdict_unbaselined requires one required jig verdict to host the baseline at the same sha
    status: implemented
    description: >
      temper#106, for jig v0.1.4 split verdicts (required.yml inputs
      self-job and baseline-job). Fixtures follow relay's planned
      three-workflow shape. Positive controls: one workflow hosts the
      baseline and two pass baseline-job "", the standard single-workflow
