      non-required verdicts counted fails 3, "" counted as hosting fails 5.
      Owner and repository match without case through the shared
      REMOTE_REUSABLE parser (security review: a PulseEngine/JIG spelling
      failed open); a case-sensitive mutant fails 1. The path stays
      case-sensitive.
      Live: warte main 3bb73ce, read through fetchSnapshot at the jig pin
      0a7b358, gives no finding; the same files with baseline-job ""
      planted into ci.yml give exactly one.
    fields:
      method: automated-test
      test-name: "jig split verdicts: one required verdict must host the baseline (temper#106)"
      test-location: __tests__/unit/gate-skip.test.js
    links:
