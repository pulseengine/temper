  - id: REQ-044
    type: requirement
    title: A required check temper names SHALL be bound to the app that reports it, and a sync SHALL keep the binding of a check it only carries over
    status: implemented
    description: >
      temper#100. Checks from standards.repos.<repo>.required_checks and
      required workflows are bound to GitHub Actions (standards.checks_app_id,
      default 15368), so no other installed app can post a passing status
      under that name, replacing any other app's binding. That matters once
      a repo requires one context ("required / verdict", jig). For a context
      only carried over, a binding already on the repo (classic app_id or
      ruleset integration_id) is kept instead of being stripped, and an
      unbound one stays unbound. The plan
      reports a named but unbound check as check_source drift.
    fields:
      priority: must
      category: functional
      upstream-ref: "pulseengine/temper#100"
    links:
      - type: derives-from
        target: SC-009
      - type: derives-from
        target: SC-002

  - id: DD-005
    type: design-decision
    title: Bind only the checks temper names; carry every existing binding; leave carried-over unbound checks unbound
    status: implemented
    fields:
      decision: >
        intendedChecks binds a context to standards.checks_app_id whenever
        temper named it (repos.<repo>.required_checks or a required
        workflow), replacing another app's binding. A context only carried
        over keeps its existing binding, or a name-only entry. Drift counts
        only bindings that bind admins (classic with enforce_admins, rulesets
        without bypass).
      rationale: >
        A check temper names is one temper knows is a workflow job, so
        Actions is its source. A carried-over context may come from another
        app (a coverage bot, smithy's runners report as Actions too, but a
        third-party status would not), and binding it to the wrong app makes
        the repo un-mergeable. Stripping an existing binding on sync would
        weaken a stricter setting.
      alternatives: >
        Bind every context to Actions (breaks repos that require a
        non-Actions status); look up each context's app from recent check
        runs (an API call per repo per sync, and a fresh repo has none).
    links:
      - type: satisfies
        target: REQ-044

  - id: REQ-045
    type: requirement
    title: A scoped sync SHALL send exactly the planned writes of the named repos and kinds, and nothing else
    status: implemented
    description: >
      Hardening is applied in owner-approved batches (plant + sieve, then
      kiln + warte + wohl, then tag rulesets org-wide). `sync --repo R
      --only K` plans only R through the real configureRepository against
      the recording octokit and replays exactly the recorded writes of kinds
      K (merge, enforce_admins, signatures, branch_ruleset, tag_rulesets,
      labels), call for call. `plan --only K` prints that same set. Writes
      whose arguments depend on an earlier write's response, or that carry
      file content (configuration PRs), are never replayed; repos whose scope
      is not enforced are not written; a mistyped flag cannot fall through to
      the org-wide sync.
    fields:
      priority: must
      category: functional
    links:
      - type: derives-from
        target: SC-002
      - type: derives-from
        target: SC-004

  - id: DD-006
    type: design-decision
    title: A scoped sync replays the plan's recorded writes instead of threading a scope through the apply code
    status: implemented
    fields:
      decision: >
        scopedSync runs planOrg for the named repos, filters the recorded
        writes by kind (from the route template and, for rulesets, the
        target), and replays each in-scope write on the real octokit with
        the same route, path params and body. Writes that depend on an
        earlier write's response or carry file content are classified
        `other` and never replayed.
      rationale: >
        The plan is then the apply by construction: what `plan --only`
        prints is what `sync --only` sends, so the owner approves the exact
        calls. configureRepository stays the single apply path, with no
        per-rule flags to drift from it.
      alternatives: >
        Pass --only through configureRepository, enforceStandards and the
        label sync (many call sites, and the plan could diverge from a
        scoped apply); apply per repo with the full sync (cannot stage tag
        rulesets separately, and writes labels and config PRs too).
    links:
      - type: satisfies
        target: REQ-045

  - id: REQ-046
    type: requirement
    title: A generated dependabot.yml SHALL follow the fleet grouped template, one entry per ecosystem with lockstep groups before minor-patch and majors ungrouped
    status: implemented
    release: v1.1.0
    description: >
      The fleet template is pulseengine/rivet's .github/dependabot.yml (owner
      decision 2026-11-21). buildDependabotYaml writes one updates entry per
      ecosystem, its detected directories in one directories: list (directory
      when there is one), schedule monthly with config.yml's schedule_time and
      schedule_timezone (02:00, Etc/UTC), limit 2, cooldown 7 days. The
      ecosystem's lockstep groups come first because Dependabot assigns a
      dependency to the first group it matches, then one minor-patch group;
      github-actions keeps its single all-pattern group. Majors match no group
      and arrive one PR each.
    fields:
      priority: should
      category: functional
      effect: behaviour
      upstream-ref: "pulseengine/rivet#1349"
    links:
      - type: derives-from
        target: SC-007

  - id: DD-007
    type: design-decision
    title: The generator copies rivet's fleet template shape rather than inventing its own grouping
    status: implemented
    fields:
      decision: >
        buildDependabotYaml merges detected directories per ecosystem into one
        entry, keeps the version-locked families as lockstep groups, appends
        one minor-patch group, and takes the schedule time and timezone from
        config.yml's dependabot_generation.
      rationale: >
        Repos that temper bootstraps then match the hand-kept files across the
        fleet: one grouped PR per ecosystem a month instead of one per
        directory, and a major version bump read on its own.
      alternatives: >
        Keep one entry per directory (N PRs for one release of a shared
        crate); group majors too (a breaking change hides inside a batch).
    links:
      - type: satisfies
        target: REQ-046

  - id: REQ-047
    type: requirement
    title: temper SHALL NOT enable auto-merge on a PR that changes a release workflow, and SHALL NOT enable it when the PR's files cannot be read
    status: implemented
    release: v1.1.0
    description: >
      Owner rule 2026-11-25, after temper armed auto-merge on relay#726, a
      non-breaking grouped Dependabot actions PR that touched release.yml. A
      release workflow runs on a tag, so a green PR is no evidence for it.
      auto_merge.review_paths (default .github/workflows/release*.yml and
      .yaml; `*` stays within one path segment) is checked against every
      changed path and every rename source, for Dependabot and configured bot
      users alike; a match or an unreadable file list leaves the PR to a
      maintainer, with a comment saying why. The check runs when the PR is
      opened or reopened; a later push that adds a release workflow to an
      already-armed PR is not re-checked.
    fields:
      priority: must
      category: functional
      effect: behaviour
      upstream-ref: "pulseengine/relay#726"
    links:
      - type: derives-from
        target: SC-003

  - id: REQ-048
    type: requirement
    title: A difference from the standard that the owner accepted SHALL be reported as divergent_declared and SHALL NOT be written
    status: implemented
    release: v1.1.0
    description: >
      standards.accepted_deviations lists them (enforce_admins,
      required_reviews; owner 2026-11-26). enforce_admins off on classic
      protection no longer drifts no_bypass and is never POSTed; a repo that
      requires pull requests with 0 approving reviews gets an accepted
