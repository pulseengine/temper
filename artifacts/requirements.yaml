# temper requirements — derived from the STPA-Sec constraints in stpa-sec.yaml.
#
# release: v1.1.0 is the first rivet-tracked release: close the red main, make
# temper's own gate real, and record the controls already landed under
# CHANGELOG [Unreleased]. v1.2.0 takes the remaining hazard-derived work.
# release: backlog marks triaged work that is not scheduled.
#
# fields.effect: behaviour = changes what temper does; confidence = only
# raises our confidence about existing behaviour (release-planning skill).

artifacts:
  # ── v1.1.0 — new work ───────────────────────────────────────────────────
  - id: REQ-001
    type: requirement
    title: Self-update SHALL deploy a commit only after its required checks report success
    status: draft
    release: v1.1.0
    description: >
      The push handler (src/app.js) currently triggers self-update on any
      push to main. It must first confirm a completed-success check suite
      for the pushed SHA, and refuse otherwise.
    fields:
      priority: must
      category: functional
      effect: behaviour
      upstream-ref: "pulseengine/temper#76"
    links:
      - type: derives-from
        target: SC-001

  - id: REQ-002
    type: requirement
    title: temper's own main SHALL require its CI checks (lint, test, ci) before merge
    status: draft
    release: v1.1.0
    fields:
      priority: must
      category: constraint
      effect: behaviour
      upstream-ref: "pulseengine/temper#76"
    links:
      - type: derives-from
        target: SC-001

  - id: REQ-003
    type: requirement
    title: temper SHALL ship with no high-severity npm advisory, and CI SHALL fail on one
    status: draft
    release: v1.1.0
    description: >
      At c4ee454 the audit step reports 19 advisories (7 high) and main is
      red. Fix the advisories; keep the audit failing the build.
    fields:
      priority: must
      category: non-functional
      effect: behaviour
    links:
      - type: derives-from
        target: SC-008

  - id: REQ-004
    type: requirement
    title: temper SHALL run on a supported Node LTS (22 or 24) in CI, Docker and engines
    status: draft
    release: v1.1.0
    fields:
