      effect: behaviour
    links:
      - type: derives-from
        target: SC-008

  - id: REQ-005
    type: requirement
    title: The rivet oracle SHALL run the rivet binary from the varve layer pinned in varve.toml
    status: draft
    release: v1.1.0
    description: >
      varve.toml pins realm pulseengine, layer 2026.11.0 (rivet 0.41.1).
      ai_review.rivet.binary_path must resolve through `varve which rivet`
      instead of the hand-placed data/rivet/rivet.
    fields:
      priority: must
      category: functional
      effect: behaviour
    links:
      - type: derives-from
        target: SC-008

  - id: REQ-006
    type: requirement
