  # ── Security scenarios ──────────────────────────────────────────────────
  - id: SS-001
    type: sec-scenario
    title: Dependabot PR to temper is auto-merged, deployed, and its install script takes the private key
    status: draft
    description: >
      1. A compromised npm package version is published. 2. Dependabot opens
      a bump PR in temper. 3. temper enables auto-merge on its own bot PR;
      no required checks on main (#76), or CI passes because install scripts
      are not tested. 4. The merge pushes main. 5. The push handler matches
      on repository.name and ref only. 6. The updater resets to origin/main
      and runs npm ci with process.env. 7. postinstall reads PRIVATE_KEY.
    fields:
      scenario-type: adversarial-control-path
      attack-vector: network
      attacker-type: supply-chain
      causal-factors:
        - no required checks on temper main (#76)
        - deploy not bound to payload.after or a passing check suite
        - repo matched by name only (src/app.js:1080)
        - npm ci without --ignore-scripts, full env inherited
        - no post-deploy health check or rollback
    links:
      - type: caused-by-sec-uca
        target: SU-001
      - type: caused-by-sec-uca
        target: SU-010
      - type: leads-to-sec-hazard
        target: SH-001
      - type: leads-to-sec-hazard
        target: SH-005

