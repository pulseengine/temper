version: 2
# Grouped monthly updates (fleet template from pulseengine/rivet, owner
# decision 2026-11-21). One entry per ecosystem, its directories in one
# `directories:` list. Every entry runs monthly (the 1st, 02:00 UTC), keeps at
# most 2 PRs open, and waits 7 days after a release (cooldown). Lockstep groups
# come first because Dependabot puts a dependency in the FIRST group it
# matches; then one minor-patch group. Majors stay ungrouped, one PR each.
# Security updates ignore the schedule and the limit.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      octokit:
        patterns:
          - "@octokit/*"
      babel:
        patterns:
          - "@babel/*"
          - "babel-*"
      jest:
        patterns:
          - "jest"
          - "@types/jest"
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directories:
      - /triage
      - /eval/review-bench/revmatch
      - /tools/self-update
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      rustls:
        patterns:
          - "rustls"
          - "rustls-*"
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
