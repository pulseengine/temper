name: readme-blocks release

# Builds, checks, signs and publishes the readme-blocks WASI module
# (tools/readme-blocks) for a readme-blocks-v* tag, the delivery agreed with
# smithy in pulseengine/temper#128: the wasm32-wasip1 module, a CycloneDX
# SBOM and build-env.txt, all inside SHA256SUMS.txt, which cosign signs
# keyless; a GitHub build attestation for the module. smithy verifies all
# three, pins version and sha256, and installs the module read-only.
#
# The prefix keeps these tags apart from temper's v* and temper-triage-v*
# tags. Signing happens only in a run for a readme-blocks-v* tag ref: the
# keyless certificate then names readme-blocks-release.yml@refs/tags/<tag>.
# There is no workflow_dispatch. To retry a failed tag run, use "Re-run
# failed jobs", which keeps the tag ref.
#
# Runners: GitHub-hosted on purpose. The trigger is a tag push (never a pull
# request) and signed builds run on fresh ephemeral machines. Images are
# pinned (ubuntu-24.04, not ubuntu-latest).
concurrency:
  group: readme-blocks-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "readme-blocks-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # The tag must name Cargo.toml's version before anything compiles.
  version-guard:
    name: Tag names the crate version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare the tag with tools/readme-blocks/Cargo.toml
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/tags/readme-blocks-v*) ;; *) echo "not a readme-blocks-v* tag: $GITHUB_REF"; exit 1 ;; esac
          tag="${GITHUB_REF#refs/tags/readme-blocks-v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' tools/readme-blocks/Cargo.toml | head -1)
          test -n "$crate"
          test "$tag" = "$crate" || { echo "tag $tag != tools/readme-blocks/Cargo.toml $crate"; exit 1; }

  build-module:
    name: Build wasm32-wasip1 and wasm32-wasip2
    needs: [version-guard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip1, wasm32-wasip2

      - name: Tests
        working-directory: tools/readme-blocks
        run: cargo test --locked --no-fail-fast

      - name: Build the modules
        working-directory: tools/readme-blocks
        run: |
          set -euo pipefail
          cargo build --locked --release --target wasm32-wasip1
          cargo build --locked --release --target wasm32-wasip2

      - name: Name the modules
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p out
          cp tools/readme-blocks/target/wasm32-wasip1/release/readme-blocks.wasm "out/${TAG}-wasm32-wasip1.wasm"
          cp tools/readme-blocks/target/wasm32-wasip2/release/readme-blocks.wasm "out/${TAG}-wasm32-wasip2.wasm"
          {
            echo "MODULE=out/${TAG}-wasm32-wasip1.wasm"
            echo "COMPONENT=out/${TAG}-wasm32-wasip2.wasm"
            echo "VERSION=${TAG#readme-blocks-v}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # The named file a user downloads, run the way temper loads it.
      - name: Smoke-test the module under node:wasi
        run: |
          set -euo pipefail
          node --no-warnings tools/readme-blocks/tests/wasi-smoke.mjs "$MODULE" .
          cat > run.mjs <<'JS'
          import { WASI } from 'node:wasi';
          import { readFile } from 'node:fs/promises';
          const wasi = new WASI({ version: 'preview1', args: ['readme-blocks', ...process.argv.slice(3)], env: {}, returnOnExit: true });
          const inst = await WebAssembly.instantiate(await WebAssembly.compile(await readFile(process.argv[2])), wasi.getImportObject());
          process.exitCode = wasi.start(inst);
          JS
          test "$(node --no-warnings run.mjs "$MODULE" --version)" = "readme-blocks $VERSION"
          set +e; node --no-warnings run.mjs "$MODULE" --no-such-flag 2>/dev/null; rc=$?; set -e
          test "$rc" -eq 2

      # The p2 file is released for kiln once it runs it; smithy pins and
      # deploys only the p1 file (pulseengine/temper#128).
      - name: Smoke-test the component under wasmtime
        env:
          WASMTIME_VERSION: v50.0.1
          WASMTIME_SHA256: 685466455dd42a14774a86c36c8f2e45cbb9bd6d92a850139315df60a75498a5
        run: |
          set -euo pipefail
          grep -aq exit-with-code "$COMPONENT"
          t="$RUNNER_TEMP/wasmtime"; mkdir -p "$t"
          a="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -fsSL --proto '=https' -o "$t/$a.tar.xz" "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/$a.tar.xz"
          echo "${WASMTIME_SHA256}  $t/$a.tar.xz" | sha256sum -c -
          tar -xJf "$t/$a.tar.xz" -C "$t"
          bash tools/readme-blocks/tests/wasip2-smoke.sh wasmtime "$t/$a/wasmtime" "$COMPONENT" .
          test "$("$t/$a/wasmtime" run "$COMPONENT" --version)" = "readme-blocks $VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: module
          path: |
            ${{ env.MODULE }}
            ${{ env.COMPONENT }}
          retention-days: 7

  # The SBOM tool runs here, with a read-only token, not in the signing job.
  sbom:
    name: SBOM (CycloneDX)
    needs: [version-guard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.10

      - name: Generate the SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path tools/readme-blocks/Cargo.toml --format json --spec-version 1.5
          src=$(find tools/readme-blocks -maxdepth 1 -name '*.cdx.json' | head -1)
          test -n "$src" && test -s "$src"
          mkdir -p sbom && cp "$src" sbom/readme-blocks.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom/readme-blocks.cdx.json
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-module, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p release-assets
          find artifacts -type f -name "*.wasm" -exec cp {} release-assets/ \;
          # Exactly one p1 and one p2 file, each named for its target, and no
          # other .wasm: smithy pins the p1 file by exact name.
          test -f "release-assets/${TAG}-wasm32-wasip1.wasm"
          test -f "release-assets/${TAG}-wasm32-wasip2.wasm"
          n=$(find release-assets -maxdepth 1 -name "*.wasm" | wc -l)
          test "$n" -eq 2 || { echo "expected 2 modules (wasip1, wasip2), found $n"; exit 1; }
          cp artifacts/sbom/readme-blocks.cdx.json "release-assets/${TAG}.cdx.json"

      - name: Capture build environment
        run: |
          set -euo pipefail
          {
            echo "rustc: 1.100.0 (dtolnay/rust-toolchain, pinned in build-module)"
            echo "targets: wasm32-wasip1 (temper loads it with node:wasi), wasm32-wasip2 (component)"
            echo "smoke runner for wasip2: wasmtime v50.0.1 (sha256-pinned)"
            echo "rivet-yaml: rivet tag v0.43.3 (tools/readme-blocks/Cargo.lock)"
            echo "cosign: v2.4.1 (sigstore/cosign-installer, pinned below)"
            echo "runner: $(uname -srm)"
          } > release-assets/build-env.txt

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Nothing is attested or signed from a branch, whatever started the run.
      - name: Sign only from a readme-blocks tag ref
        run: |
          case "$GITHUB_REF" in refs/tags/readme-blocks-v*) ;; *) echo "refusing to sign $GITHUB_REF"; exit 1 ;; esac

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-assets/*.wasm"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Work in progress; no production-ready claims. The module speaks
          interface version 1 (\`readme-blocks interface-version\`).

          Verify this release:

              cosign verify-blob \\
                --certificate-identity-regexp '^https://github.com/pulseengine/temper/.github/workflows/readme-blocks-release.yml@refs/tags/readme-blocks-v.*$' \\
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
                --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
              sha256sum -c --ignore-missing SHA256SUMS.txt
              gh attestation verify ${TAG}-wasm32-wasip1.wasm --repo pulseengine/temper

          temper loads the wasm32-wasip1 module. The wasm32-wasip2 file is the
          same crate as a command component, for runtimes such as kiln.
          EOF
          # Never overwrite published assets: to re-run, delete the release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; delete it before re-running" >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "readme-blocks ${TAG#readme-blocks-}" \
            --notes-file "$notes" --prerelease --latest=false release-assets/*
