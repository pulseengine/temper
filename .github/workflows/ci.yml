name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage
      - name: Security audit
        run: npm audit --audit-level=moderate
      # Lockfiles: every manifest has a committed lock, every lock is
      # audited, and the audits are found by glob, never by a fixed list
      # (a nested lock was missed elsewhere in the org, 2026-11-20).
      - name: Every manifest has a committed lockfile
        run: |
          set -euo pipefail
          check() {
            local bad=0 m l
            for m in $(git ls-files -- ':(glob)**/Cargo.toml'); do
              l="$(dirname "$m")/Cargo.lock"
              git ls-files --error-unmatch -- "$l" >/dev/null 2>&1 || { echo "::error file=$m::$l is not committed"; bad=1; }
            done
            for l in package-lock.json pnpm-lock.yaml MODULE.bazel.lock; do
              git ls-files --error-unmatch -- "$l" >/dev/null 2>&1 || { echo "::error::$l is not committed"; bad=1; }
            done
            return $bad
          }
          check
          # Planted control: the same check on an index without one lock must fail.
          export GIT_INDEX_FILE="$RUNNER_TEMP/planted.index"
          cp "$(git rev-parse --git-dir)/index" "$GIT_INDEX_FILE"
          git rm -q --cached tools/self-update/Cargo.lock
          if check >/dev/null; then echo "planted missing lock was not caught"; exit 1; fi
      - name: pnpm-lock.yaml (Bazel's npm lock) matches package.json and is audited
        run: |
          set -euo pipefail
          npx --yes pnpm@9.15.9 install --frozen-lockfile --lockfile-only --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml
          npx --yes pnpm@9.15.9 audit --audit-level=moderate
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny advisories on every Cargo.lock
        run: |
          set -euo pipefail
          n=0
          for l in $(git ls-files -- ':(glob)**/Cargo.lock'); do
            echo "== $l"
            cargo deny --manifest-path "$(dirname "$l")/Cargo.toml" --locked check advisories
            n=$((n + 1))
          done
          echo "audited $n Cargo.lock files"
          test "$n" -ge 3
          # Planted control: a crate locked to a version with a known
          # advisory (time 0.1.43, RUSTSEC-2020-0071) must fail.
          p="$RUNNER_TEMP/planted-crate"; mkdir -p "$p/src"
          printf '[package]\nname = "planted"\nversion = "0.0.0"\nedition = "2021"\n[dependencies]\ntime = "=0.1.43"\n' > "$p/Cargo.toml"
          echo 'fn main() {}' > "$p/src/main.rs"
          cargo generate-lockfile --manifest-path "$p/Cargo.toml"
          if cargo deny --manifest-path "$p/Cargo.toml" --locked check advisories; then
            echo "planted advisory was not caught"; exit 1
          fi
      - name: tools/self-update builds from its lock
        run: cargo build --locked --manifest-path tools/self-update/Cargo.toml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx eslint src/ index.js functions.js __tests__/ scripts/

  # rivet traceability gate. rivet comes from the varve layer pinned in
  # varve.toml, never from a cargo build or a binary left on the runner.
  # varve itself is installed verified-first: cosign checks SHA256SUMS.txt,
  # the sums check install.sh, and only then does a shell read it.
  rivet:
    runs-on: ubuntu-latest
    env:
      VARVE_VERSION: v0.44.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install varve (verified)
        run: |
          set -euo pipefail
          B="https://github.com/pulseengine/varve/releases/download/$VARVE_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 5 "$B/install.sh"
          curl -fsSLO --retry 5 "$B/SHA256SUMS.txt"
          curl -fsSLO --retry 5 "$B/SHA256SUMS.txt.cosign.bundle"
          cosign verify-blob \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity-regexp '^https://github\.com/pulseengine/varve/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          sha256sum -c --ignore-missing --strict SHA256SUMS.txt
          grep -Eq '[ /]install\.sh$' SHA256SUMS.txt
          sh install.sh
          echo "$HOME/.varve/bin" >> "$GITHUB_PATH"
      - name: Lay down the pinned layer
        run: |
          set -euo pipefail
          varve install
          echo "$(dirname "$(varve which rivet | tail -n1)")" >> "$GITHUB_PATH"
      - name: rivet is the layer's binary
        run: |
          set -euo pipefail
          test "$(command -v rivet)" = "$(varve which rivet | tail -n1)"
          rivet --version
      - name: Validate rivet artifacts
        run: rivet validate
      - name: Links are bidirectional
        run: rivet check bidirectional

  # The org hostname scanner temper distributes (rule 4): its own tests, the
  # Python 3.9 floor checked mechanically, then the action run on this repo's
  # own diff — temper is the first repo the check gates.
  hostname-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scanner self-test
        run: python3 -m unittest discover -s .github/actions/hostname-scan -p 'test_*.py' -v
      - name: Python 3.9 floor
        run: pipx run --spec vermin==1.9.2 vermin -t=3.9- --no-tips --violations .github/actions/hostname-scan/
      - name: Scan this change
        uses: ./.github/actions/hostname-scan

  # The skipped-required-check probe temper distributes (docs/gate-probe.md):
  # its self-test (a fail-open detector must be caught) and the 3.9 floor.
  gate-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No build residue in distributed actions
        run: |
          if git ls-files -- '*.pyc' '**/__pycache__/**' | grep .; then
            echo "tracked Python bytecode in the repo (other repos run these actions)"; exit 1
          fi
      - name: Probe self-test
        run: python3 -m unittest discover -s .github/actions/gate-probe -p 'test_*.py' -v
      - name: Python 3.9 floor
        run: pipx run --spec vermin==1.9.2 vermin -t=3.9- --no-tips --violations .github/actions/gate-probe/

  # temper-triage (docs/triage.md): the Rust reply run and its negative
  # controls. Hosted on purpose: this workflow runs on pull requests.
  triage:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: triage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11-15
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (negative controls, private-host equivalence, App JWT)
        run: cargo test --locked --no-fail-fast
      - name: CLI conventions
        run: |
          set -euo pipefail
          b=target/debug/temper-triage
          test "$($b --version)" = "temper-triage $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          $b --help > /dev/null
          set +e; $b --no-such-flag 2>/dev/null; rc=$?; set -e
          test "$rc" -eq 2

  # The review benchmark (eval/review-bench, temper#92): the matcher's tests,
  # every reference/known file anchored on its diff, and the reference
  # scoring 1.0 against itself (fails closed if data or matcher drift).
  review-bench:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: eval/review-bench/revmatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11-15
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Format and clippy
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Matcher tests
        run: cargo test --locked --no-fail-fast
      - name: Every reference and known finding quotes an added line
        run: |
          set -euo pipefail
          cargo build --locked --release
          n=0
          for d in ../prs/*/; do
            target/release/revmatch validate "$d/diff.patch" "$d/reference.json"
            target/release/revmatch validate "$d/diff.patch" "$d/known.json"
            n=$((n + 1))
          done
          test "$n" -ge 9
      - name: The reference scores 1.0 against itself
        run: |
          set -euo pipefail
          out=$(target/release/revmatch score --prs ../prs --reference --format json)
          echo "$out" | jq '{reference_findings, recall_primary, false_findings}'
          echo "$out" | jq -e '.recall_primary == 1' > /dev/null
          echo "$out" | jq -e '.reference_findings >= 33' > /dev/null

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # error, not update: a stale MODULE.bazel.lock fails here instead of
      # being rewritten on the runner.
      - run: bazel build --lockfile_mode=error //...
      - run: bazel test --lockfile_mode=error //...

  sbom:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json

  # Attest build provenance for main-branch artifacts (consumed by
  # downstream attestation verifiers).
  provenance:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'package.json'
