name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx eslint src/ index.js functions.js __tests__/ scripts/

  # rivet traceability gate. rivet comes from the varve layer pinned in
  # varve.toml, never from a cargo build or a binary left on the runner.
  # varve itself is installed verified-first: cosign checks SHA256SUMS.txt,
  # the sums check install.sh, and only then does a shell read it.
  rivet:
    runs-on: ubuntu-latest
    env:
      VARVE_VERSION: v0.44.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install varve (verified)
        run: |
          set -euo pipefail
          B="https://github.com/pulseengine/varve/releases/download/$VARVE_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 5 "$B/install.sh"
          curl -fsSLO --retry 5 "$B/SHA256SUMS.txt"
          curl -fsSLO --retry 5 "$B/SHA256SUMS.txt.cosign.bundle"
          cosign verify-blob \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity-regexp '^https://github\.com/pulseengine/varve/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          sha256sum -c --ignore-missing --strict SHA256SUMS.txt
          grep -Eq '[ /]install\.sh$' SHA256SUMS.txt
          sh install.sh
          echo "$HOME/.varve/bin" >> "$GITHUB_PATH"
      - name: Lay down the pinned layer
        run: |
          set -euo pipefail
          varve install
          echo "$(dirname "$(varve which rivet | tail -n1)")" >> "$GITHUB_PATH"
      - name: rivet is the layer's binary
        run: |
          set -euo pipefail
          test "$(command -v rivet)" = "$(varve which rivet | tail -n1)"
          rivet --version
      - name: Validate rivet artifacts
        run: rivet validate
      - name: Links are bidirectional
        run: rivet check bidirectional

  # The org hostname scanner temper distributes (rule 4): its own tests, the
  # Python 3.9 floor checked mechanically, then the action run on this repo's
  # own diff — temper is the first repo the check gates.
  hostname-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scanner self-test
        run: python3 -m unittest discover -s .github/actions/hostname-scan -p 'test_*.py' -v
      - name: Python 3.9 floor
        run: pipx run --spec vermin==1.9.2 vermin -t=3.9- --no-tips --violations .github/actions/hostname-scan/
      - name: Scan this change
        uses: ./.github/actions/hostname-scan

  # The skipped-required-check probe temper distributes (docs/gate-probe.md):
  # its self-test (a fail-open detector must be caught) and the 3.9 floor.
  gate-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No build residue in distributed actions
        run: |
          if git ls-files -- '*.pyc' '**/__pycache__/**' | grep .; then
            echo "tracked Python bytecode in the repo (other repos run these actions)"; exit 1
          fi
      - name: Probe self-test
        run: python3 -m unittest discover -s .github/actions/gate-probe -p 'test_*.py' -v
      - name: Python 3.9 floor
        run: pipx run --spec vermin==1.9.2 vermin -t=3.9- --no-tips --violations .github/actions/gate-probe/

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: bazel build //...
      - run: bazel test //...

  sbom:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json

  # Attest build provenance for main-branch artifacts (consumed by
  # downstream attestation verifiers).
  provenance:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'package.json'
