# Temper Configuration

# Organization to monitor
organization: pulseengine

# Bot mention name (without [bot] suffix)
bot_name: temper-pulseengine

# Users authorized to trigger commands
allowed_command_users:
  - avrabe

# Target settings for repositories
settings:
  merge:
    allow_merge_commit: false
    allow_squash_merge: false
    allow_rebase_merge: true
    delete_branch_on_merge: true

forks:
  merge:
    allow_merge_commit: true
    allow_squash_merge: true
    allow_rebase_merge: true
    delete_branch_on_merge: true

branch_protection:
  default:
    required_status_checks:
      strict: true
      contexts: ["ci", "lint", "test"]
    enforce_admins: true
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      require_last_push_approval: true
    required_linear_history: true
    required_conversation_resolution: true
    restrictions: null
    allow_force_pushes: false
    allow_deletions: false
    require_signed_commits: true

issue_labels:
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"
  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: "question"
    color: "d876e3"
    description: "Further information is requested"
  - name: "dependencies"
    color: "0366d6"
    description: "Dependency updates"
  - name: "automation"
    color: "0e8a16"
    description: "Automation updates"
