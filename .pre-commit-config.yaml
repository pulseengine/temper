repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.2.5
        files: "\\.(js|json|md|yml|yaml)$"
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings=0
        language: system
        types: [javascript]
        files: "\\.(js|mjs|cjs)$"
      - id: tests
        name: tests (optional)
        entry: npx jest --config jest.config.cjs --passWithNoTests --bail
        language: system
        pass_filenames: false
        stages: [manual]
