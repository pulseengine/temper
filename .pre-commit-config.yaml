repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
        exclude: "(__tests__/fixtures/|GITHUB_APP_SETUP\\.md|DEVELOPMENT\\.md)"
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --quiet
        language: system
        types: [javascript]
        files: "\\.(js|mjs|cjs)$"
      - id: jest
        name: jest
        entry: npx jest --config jest.config.cjs --bail --passWithNoTests
        language: system
        pass_filenames: false
        stages: [pre-push]
